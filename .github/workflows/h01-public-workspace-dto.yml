name: H-01 Public Workspace DTO

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: h01-public-workspace-dto
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: github.head_ref == 'fix/h01-public-workspace-dto'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/h01-public-workspace-dto
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply H-01 remediation
        run: python scripts/applyH01PublicWorkspaceDto.py

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused H-01 boundary tests
        run: npm run test:h01-public-dto

      - name: Check syntax and core smoke flow
        run: npm run check:syntax && npm run smoke:core

      - name: Run complete regression suite
        id: regression
        shell: bash
        run: |
          set +e
          npm test > /tmp/h01-regression.log 2>&1
          status=$?
          set -e
          cat /tmp/h01-regression.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish regression diagnostic
        if: failure() && steps.regression.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            grep -nE 'FAIL|Error:|AssertionError|failed|not ok|Expected|Received|Test timeout|playwright' /tmp/h01-regression.log | tail -n 100 || true
            echo
            tail -n 220 /tmp/h01-regression.log
          } > /tmp/h01-regression-diagnostic.log
          diagnostic="$(tail -c 14000 /tmp/h01-regression-diagnostic.log)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="### H-01 regression diagnostic\n\n\`\`\`text\n${diagnostic}\n\`\`\`"

      - name: Run production and Azure preflights
        run: npm run preflight:production && npm run preflight:azure

      - name: Validate disclosure boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'createPublicStudentWorkspaceDTO' backend/server.js
          ! sed -n '/function publicState(state, persistence)/,/async function readRecoveryBody/p' backend/server.js | grep -q '\.\.\.state'
          grep -q 'FORBIDDEN_PUBLIC_WORKSPACE_KEYS' backend/presentation/publicStudentWorkspaceDto.js
          grep -q 'aiConversations' backend/presentation/publicStudentWorkspaceDto.js
          grep -q 'recoveryPreviews' backend/presentation/publicStudentWorkspaceDto.js
          git diff --check

      - name: Commit validated remediation
        shell: bash
        run: |
          rm -f .github/workflows/h01-public-workspace-dto.yml
          rm -f scripts/applyH01PublicWorkspaceDto.py
          git config user.name "StudentOS Security Remediation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix H-01 public workspace disclosure boundary"
          git push origin HEAD:fix/h01-public-workspace-dto
