name: Azure Container Apps - StudentOS API and Worker

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag. Defaults to the commit SHA.
        required: false
        type: string
      location:
        description: Azure region.
        required: false
        default: centralindia
        type: string
      enable_adaptive_recovery:
        description: Enable recovery only after migration 002 and worker validation succeed.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: studentos-azure-container-apps
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/studentos-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: azure-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select image tag
        id: image
        shell: bash
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:$TAG" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR for push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          provenance: false

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Select Azure subscription
        uses: azure/cli@v2
        with:
          inlineScript: |
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Ensure resource group
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --location "${{ inputs.location || secrets.AZURE_LOCATION }}" \
              --output none

      - name: Validate existing ACA environment settings
        shell: bash
        run: |
          if [ -z "${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT }}" ]; then
            echo "AZURE_CONTAINER_APP_ENVIRONMENT is required." >&2
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT_RESOURCE_GROUP }}" ]; then
            echo "AZURE_CONTAINER_APP_ENVIRONMENT_RESOURCE_GROUP is required to reuse the existing ACA environment." >&2
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_WORKER_CONTAINER_APP_NAME }}" ]; then
            echo "AZURE_WORKER_CONTAINER_APP_NAME is required for the dedicated worker topology." >&2
            exit 1
          fi

      - name: Confirm Router V2 production traffic is disabled before live gates
        if: ${{ vars.STUDENTOS_AI_ROUTER_V2_ENABLED == 'true' }}
        shell: bash
        run: |
          for app_name in "${{ secrets.AZURE_CONTAINER_APP_NAME }}" "${{ secrets.AZURE_WORKER_CONTAINER_APP_NAME }}"; do
            if ! az containerapp show --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --name "$app_name" --output none 2>/dev/null; then
              continue
            fi
            enabled="$(az containerapp show --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --name "$app_name" --query "properties.template.containers[0].env[?name=='STUDENTOS_AI_ROUTER_V2_ENABLED'].value | [0]" --output tsv)"
            rollout="$(az containerapp show --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --name "$app_name" --query "properties.template.containers[0].env[?name=='STUDENTOS_AI_ROUTER_V2_ROLLOUT_PERCENT'].value | [0]" --output tsv)"
            if [ "$enabled" = "true" ] || { [ -n "$rollout" ] && [ "$rollout" != "0" ]; }; then
              echo "Router V2 production traffic must be disabled on both applications before live pre-enable gates run." >&2
              exit 1
            fi
          done
          echo "Router V2 production traffic is disabled while live pre-enable gates run."

      - name: Validate backend runtime secrets
        shell: bash
        env:
          STUDENTOS_MODE: supabase
          STUDENTOS_SUPABASE_URL_1: ${{ secrets.STUDENTOS_SUPABASE_URL_1 }}
          STUDENTOS_SUPABASE_ANON_KEY_1: ${{ secrets.STUDENTOS_SUPABASE_ANON_KEY_1 }}
          STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_1: ${{ secrets.STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_1 }}
          STUDENTOS_SUPABASE_URL_2: ${{ secrets.STUDENTOS_SUPABASE_URL_2 }}
          STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_2: ${{ secrets.STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_2 }}
          STUDENTOS_SUPABASE_URL_3: ${{ secrets.STUDENTOS_SUPABASE_URL_3 }}
          STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_3: ${{ secrets.STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_3 }}
          STUDENTOS_SUPABASE_URL_4: ${{ secrets.STUDENTOS_SUPABASE_URL_4 }}
          STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_4: ${{ secrets.STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_4 }}
          STUDENTOS_SUPABASE_JWT_SECRET: ${{ secrets.STUDENTOS_SUPABASE_JWT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          STUDENTOS_BACKGROUND_WORKERS_ENABLED: 'true'
          STUDENTOS_ADAPTIVE_RECOVERY_ENABLED: 'false'
          STUDENTOS_AI_PROVIDER_CYCLE_ENABLED: ${{ vars.STUDENTOS_AI_PROVIDER_CYCLE_ENABLED || 'false' }}
          STUDENTOS_AI_PROVIDER_CYCLE_SHADOW: ${{ vars.STUDENTOS_AI_PROVIDER_CYCLE_SHADOW || 'false' }}
          STUDENTOS_AI_PROVIDER_CYCLE_ROLLOUT_PERCENT: ${{ vars.STUDENTOS_AI_PROVIDER_CYCLE_ROLLOUT_PERCENT || '0' }}
          STUDENTOS_AI_ROUTER_V2_ENABLED: ${{ vars.STUDENTOS_AI_ROUTER_V2_ENABLED || 'false' }}
          STUDENTOS_AI_ROUTER_V2_ROLLOUT_PERCENT: ${{ vars.STUDENTOS_AI_ROUTER_V2_ROLLOUT_PERCENT || '0' }}
          STUDENTOS_AI_GROQ_ENABLED: ${{ vars.STUDENTOS_AI_GROQ_ENABLED || 'true' }}
          STUDENTOS_AI_GEMINI_ENABLED: ${{ vars.STUDENTOS_AI_GEMINI_ENABLED || 'true' }}
          STUDENTOS_AI_NVIDIA_ENABLED: ${{ vars.STUDENTOS_AI_NVIDIA_ENABLED || 'false' }}
          STUDENTOS_AI_POLLINATIONS_ENABLED: ${{ vars.STUDENTOS_AI_POLLINATIONS_ENABLED || 'true' }}
        run: |
          missing=()
          for name in \
            STUDENTOS_SUPABASE_URL_1 \
            STUDENTOS_SUPABASE_ANON_KEY_1 \
            STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_1 \
            STUDENTOS_SUPABASE_URL_2 \
            STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_2 \
            STUDENTOS_SUPABASE_URL_3 \
            STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_3 \
            STUDENTOS_SUPABASE_URL_4 \
            STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_4 \
            STUDENTOS_SUPABASE_JWT_SECRET; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required Azure backend secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "Required backend runtime secret names are configured."
          node scripts/validateAzureAiProviderSecrets.js
          if [ "$STUDENTOS_AI_ROUTER_V2_ENABLED" = "true" ]; then
            node scripts/verifyAiRouterV2Config.js --live-registries
            node scripts/verifyAiRouterV2Migrations.js --live
            STUDENTOS_AI_ROUTER_V2_LIVE_TEST=true npm run test:router-v2-db
          else
            node scripts/verifyAiRouterV2Config.js
            node scripts/verifyAiRouterV2Migrations.js
          fi

      - name: Deploy Container App infrastructure
        uses: azure/cli@v2
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --template-file infra/azure/containerapp.bicep \
              --parameters \
                location="${{ inputs.location || secrets.AZURE_LOCATION }}" \
                containerAppName="${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
                workerContainerAppName="${{ secrets.AZURE_WORKER_CONTAINER_APP_NAME }}" \
                managedEnvironmentName="${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT }}" \
                useExistingEnvironment=true \
                existingEnvironmentName="${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT }}" \
                existingEnvironmentResourceGroup="${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT_RESOURCE_GROUP }}" \
                image="${{ steps.image.outputs.image }}" \
                targetPort=3101 \
                minReplicas=0 \
                maxReplicas=1 \
                registryServer="ghcr.io" \
                registryUsername="${{ github.repository_owner }}" \
                registryPassword="$GHCR_PULL_TOKEN" \
              --output none

      - name: Map backend runtime secrets
        uses: azure/cli@v2
        env:
          STUDENTOS_SUPABASE_URL_1: ${{ secrets.STUDENTOS_SUPABASE_URL_1 }}
          STUDENTOS_SUPABASE_ANON_KEY_1: ${{ secrets.STUDENTOS_SUPABASE_ANON_KEY_1 }}
          STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_1: ${{ secrets.STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_1 }}
          STUDENTOS_SUPABASE_URL_2: ${{ secrets.STUDENTOS_SUPABASE_URL_2 }}
          STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_2: ${{ secrets.STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_2 }}
          STUDENTOS_SUPABASE_URL_3: ${{ secrets.STUDENTOS_SUPABASE_URL_3 }}
          STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_3: ${{ secrets.STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_3 }}
          STUDENTOS_SUPABASE_URL_4: ${{ secrets.STUDENTOS_SUPABASE_URL_4 }}
          STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_4: ${{ secrets.STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_4 }}
          STUDENTOS_SUPABASE_JWT_SECRET: ${{ secrets.STUDENTOS_SUPABASE_JWT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          STUDENTOS_BACKGROUND_WORKERS_ENABLED: 'true'
          STUDENTOS_ADAPTIVE_RECOVERY_ENABLED: 'false'
          STUDENTOS_AI_PROVIDER_CYCLE_ENABLED: ${{ vars.STUDENTOS_AI_PROVIDER_CYCLE_ENABLED || 'false' }}
          STUDENTOS_AI_PROVIDER_CYCLE_SHADOW: ${{ vars.STUDENTOS_AI_PROVIDER_CYCLE_SHADOW || 'false' }}
          STUDENTOS_AI_PROVIDER_CYCLE_ROLLOUT_PERCENT: ${{ vars.STUDENTOS_AI_PROVIDER_CYCLE_ROLLOUT_PERCENT || '0' }}
          STUDENTOS_AI_ROUTER_V2_ENABLED: ${{ vars.STUDENTOS_AI_ROUTER_V2_ENABLED || 'false' }}
          STUDENTOS_AI_ROUTER_V2_ROLLOUT_PERCENT: ${{ vars.STUDENTOS_AI_ROUTER_V2_ROLLOUT_PERCENT || '0' }}
          STUDENTOS_AI_GROQ_ENABLED: ${{ vars.STUDENTOS_AI_GROQ_ENABLED || 'true' }}
          STUDENTOS_AI_GEMINI_ENABLED: ${{ vars.STUDENTOS_AI_GEMINI_ENABLED || 'true' }}
          STUDENTOS_AI_NVIDIA_ENABLED: ${{ vars.STUDENTOS_AI_NVIDIA_ENABLED || 'false' }}
          STUDENTOS_AI_POLLINATIONS_ENABLED: ${{ vars.STUDENTOS_AI_POLLINATIONS_ENABLED || 'true' }}
        with:
          inlineScript: |
            optional_secret_args=""
            optional_env_args=""

            add_optional_provider_secret() {
              env_name="$1"
              secret_name="$2"
              value="$(printenv "$env_name" 2>/dev/null || true)"
              if [ -n "$value" ]; then
                optional_secret_args="$optional_secret_args ${secret_name}=${value}"
                optional_env_args="$optional_env_args ${env_name}=secretref:${secret_name}"
                echo "Prepared backend secret mapping: ${env_name} -> ${secret_name}"
              fi
            }

            run_redacted_az_step() {
              category="$1"
              shift
              log_path="/tmp/${category}.log"
              set +e
              "$@" > "$log_path" 2>&1
              exit_code=$?
              set -e
              if [ "$exit_code" -ne 0 ]; then
                echo "Azure CLI backend mapping failed (category=${category}, exit_code=${exit_code}). Raw CLI output was withheld to protect secret values." >&2
                return "$exit_code"
              fi
              echo "Azure CLI backend mapping succeeded (category=${category}, exit_code=0)."
            }

            add_optional_provider_secret GROQ_API_KEY groq-api-key
            add_optional_provider_secret GROQ_API_KEY_1 groq-api-key-1
            add_optional_provider_secret GROQ_API_KEY_2 groq-api-key-2
            add_optional_provider_secret GROQ_API_KEY_3 groq-api-key-3
            add_optional_provider_secret GROQ_API_KEY_4 groq-api-key-4
            add_optional_provider_secret GROQ_API_KEY_5 groq-api-key-5
            add_optional_provider_secret GEMINI_API_KEY gemini-api-key
            add_optional_provider_secret GEMINI_API_KEY_1 gemini-api-key-1
            add_optional_provider_secret GEMINI_API_KEY_2 gemini-api-key-2
            add_optional_provider_secret GEMINI_API_KEY_3 gemini-api-key-3
            add_optional_provider_secret GEMINI_API_KEY_4 gemini-api-key-4
            add_optional_provider_secret GEMINI_API_KEY_5 gemini-api-key-5
            add_optional_provider_secret GEMINI_API_KEY_6 gemini-api-key-6
            add_optional_provider_secret NVIDIA_API_KEY nvidia-api-key
            add_optional_provider_secret NVIDIA_API_KEY_1 nvidia-api-key-1
            add_optional_provider_secret NVIDIA_API_KEY_2 nvidia-api-key-2
            add_optional_provider_secret NVIDIA_API_KEY_3 nvidia-api-key-3
            add_optional_provider_secret POLLINATIONS_API_KEY pollinations-api-key

            # run_redacted_az_step containerapp_secret_set is applied independently to both apps.
            # run_redacted_az_step containerapp_env_update is applied independently to both apps.
            for app_name in "${{ secrets.AZURE_CONTAINER_APP_NAME }}" "${{ secrets.AZURE_WORKER_CONTAINER_APP_NAME }}"; do
            run_redacted_az_step "containerapp_secret_set_${app_name}" az containerapp secret set \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "$app_name" \
              --secrets \
                studentos-supabase-url-1="$STUDENTOS_SUPABASE_URL_1" \
                studentos-supabase-anon-key-1="$STUDENTOS_SUPABASE_ANON_KEY_1" \
                studentos-supabase-service-role-key-1="$STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_1" \
                studentos-supabase-url-2="$STUDENTOS_SUPABASE_URL_2" \
                studentos-supabase-service-role-key-2="$STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_2" \
                studentos-supabase-url-3="$STUDENTOS_SUPABASE_URL_3" \
                studentos-supabase-service-role-key-3="$STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_3" \
                studentos-supabase-url-4="$STUDENTOS_SUPABASE_URL_4" \
                studentos-supabase-service-role-key-4="$STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_4" \
                studentos-supabase-jwt-secret="$STUDENTOS_SUPABASE_JWT_SECRET" \
                $optional_secret_args \
              --output none

            run_redacted_az_step "containerapp_env_update_${app_name}" az containerapp update \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "$app_name" \
              --set-env-vars \
                STUDENTOS_SUPABASE_URL_1=secretref:studentos-supabase-url-1 \
                STUDENTOS_SUPABASE_ANON_KEY_1=secretref:studentos-supabase-anon-key-1 \
                STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_1=secretref:studentos-supabase-service-role-key-1 \
                STUDENTOS_SUPABASE_URL_2=secretref:studentos-supabase-url-2 \
                STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_2=secretref:studentos-supabase-service-role-key-2 \
                STUDENTOS_SUPABASE_URL_3=secretref:studentos-supabase-url-3 \
                STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_3=secretref:studentos-supabase-service-role-key-3 \
                STUDENTOS_SUPABASE_URL_4=secretref:studentos-supabase-url-4 \
                STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_4=secretref:studentos-supabase-service-role-key-4 \
                STUDENTOS_SUPABASE_JWT_SECRET=secretref:studentos-supabase-jwt-secret \
                STUDENTOS_AI_MODE=auto \
                STUDENTOS_BACKGROUND_WORKERS_ENABLED="$STUDENTOS_BACKGROUND_WORKERS_ENABLED" \
                STUDENTOS_ADAPTIVE_RECOVERY_ENABLED="$STUDENTOS_ADAPTIVE_RECOVERY_ENABLED" \
                STUDENTOS_RECOVERY_PREVIEW_TTL_HOURS=24 \
                STUDENTOS_AI_PROVIDER_CYCLE_ENABLED="$STUDENTOS_AI_PROVIDER_CYCLE_ENABLED" \
                STUDENTOS_AI_PROVIDER_CYCLE_SHADOW="$STUDENTOS_AI_PROVIDER_CYCLE_SHADOW" \
                STUDENTOS_AI_PROVIDER_CYCLE_ROLLOUT_PERCENT="$STUDENTOS_AI_PROVIDER_CYCLE_ROLLOUT_PERCENT" \
                STUDENTOS_AI_ROUTER_V2_ENABLED="$STUDENTOS_AI_ROUTER_V2_ENABLED" \
                STUDENTOS_AI_ROUTER_V2_ROLLOUT_PERCENT="$STUDENTOS_AI_ROUTER_V2_ROLLOUT_PERCENT" \
                STUDENTOS_AI_GROQ_ENABLED="$STUDENTOS_AI_GROQ_ENABLED" \
                STUDENTOS_AI_GEMINI_ENABLED="$STUDENTOS_AI_GEMINI_ENABLED" \
                STUDENTOS_AI_NVIDIA_ENABLED="$STUDENTOS_AI_NVIDIA_ENABLED" \
                STUDENTOS_AI_POLLINATIONS_ENABLED="$STUDENTOS_AI_POLLINATIONS_ENABLED" \
                STUDENTOS_AI_LOGICAL_OPERATION_TIMEOUT_MS=120000 \
                GEMINI_CHAT_MODEL=gemini-3.1-flash-lite \
                NVIDIA_OPENAI_ENDPOINT=https://integrate.api.nvidia.com/v1/chat/completions \
                NVIDIA_TEXT_MODEL=moonshotai/kimi-k2.6 \
                NVIDIA_STRUCTURED_MODEL="${{ vars.NVIDIA_STRUCTURED_MODEL }}" \
                POLLINATIONS_TEXT_MODEL=gpt-oss \
                POLLINATIONS_FALLBACK_MAX_MS=3600000 \
                POLLINATIONS_UPSTREAM_PROBE_INTERVAL_MS=300000 \
                POLLINATIONS_ALLOW_FREE=false \
                STUDENTOS_STORAGE_BUCKET=studentos-source-materials \
                STUDENTOS_EXPORT_STORAGE_BUCKET=studentos-data-exports \
                STUDENTOS_AUTH_REDIRECT_URL=https://studentos.sentiqlabs.com/auth/complete \
                $optional_env_args \
              --output none
            done

      - name: Validate dedicated worker resource
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            worker_json="$(az containerapp show --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --name "${{ secrets.AZURE_WORKER_CONTAINER_APP_NAME }}" --output json)"
            latest="$(jq -r '.properties.latestRevisionName // ""' <<<"$worker_json")"
            ready="$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$worker_json")"
            if [ -n "$latest" ] && [ "$latest" = "$ready" ]; then break; fi
            if [ "$attempt" = "30" ]; then
              echo "Dedicated worker did not reach a ready latest revision." >&2
              exit 1
            fi
            sleep 10
          done
          jq -e --arg image "${{ steps.image.outputs.image }}" '
            .properties.configuration.ingress == null and
            .properties.template.scale.minReplicas == 1 and
            .properties.template.scale.maxReplicas == 1 and
            .properties.template.containers[0].image == $image and
            .properties.template.containers[0].command == ["npm"] and
            .properties.template.containers[0].args == ["run", "jobs:dev"] and
            (any(.properties.template.containers[0].env[]; .name == "STUDENTOS_BACKGROUND_WORKERS_ENABLED" and .value == "true")) and
            (any(.properties.template.containers[0].env[]; .name == "STUDENTOS_ADAPTIVE_RECOVERY_ENABLED" and .value == "false")) and
            (any(.properties.template.containers[0].env[]; .name == "STUDENTOS_SUPABASE_URL_1" and .secretRef == "studentos-supabase-url-1")) and
            (any(.properties.template.containers[0].env[]; .name == "STUDENTOS_SUPABASE_ANON_KEY_1" and .secretRef == "studentos-supabase-anon-key-1")) and
            (any(.properties.template.containers[0].env[]; .name == "STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_1" and .secretRef == "studentos-supabase-service-role-key-1")) and
            (any(.properties.template.containers[0].env[]; .name == "STUDENTOS_SUPABASE_URL_2" and .secretRef == "studentos-supabase-url-2")) and
            (any(.properties.template.containers[0].env[]; .name == "STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_2" and .secretRef == "studentos-supabase-service-role-key-2")) and
            (any(.properties.template.containers[0].env[]; .name == "STUDENTOS_SUPABASE_URL_3" and .secretRef == "studentos-supabase-url-3")) and
            (any(.properties.template.containers[0].env[]; .name == "STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_3" and .secretRef == "studentos-supabase-service-role-key-3")) and
            (any(.properties.template.containers[0].env[]; .name == "STUDENTOS_SUPABASE_URL_4" and .secretRef == "studentos-supabase-url-4")) and
            (any(.properties.template.containers[0].env[]; .name == "STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_4" and .secretRef == "studentos-supabase-service-role-key-4")) and
            (any(.properties.template.containers[0].env[]; .name == "STUDENTOS_SUPABASE_JWT_SECRET" and .secretRef == "studentos-supabase-jwt-secret")) and
            (.properties.latestRevisionName == .properties.latestReadyRevisionName)
          ' <<<"$worker_json" >/dev/null
          api_json="$(az containerapp show --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" --output json)"
          api_secret_env="$(jq -c '[.properties.template.containers[0].env[] | select(.secretRef) | {name, secretRef}] | sort_by(.name)' <<<"$api_json")"
          worker_secret_env="$(jq -c '[.properties.template.containers[0].env[] | select(.secretRef) | {name, secretRef}] | sort_by(.name)' <<<"$worker_json")"
          api_secret_names="$(jq -c '[.properties.configuration.secrets[].name] | sort' <<<"$api_json")"
          worker_secret_names="$(jq -c '[.properties.configuration.secrets[].name] | sort' <<<"$worker_json")"
          if [ "$api_secret_env" != "$worker_secret_env" ] || [ "$api_secret_names" != "$worker_secret_names" ]; then
            echo "API and worker backend/provider secret wiring differs." >&2
            exit 1
          fi
          echo "Dedicated worker topology verified: image, command, no ingress, fixed replica, backend authority, recovery disabled, and ready revision."

      - name: Verify migration 002 before an enable request
        if: ${{ inputs.enable_adaptive_recovery }}
        shell: bash
        env:
          STUDENTOS_MODE: supabase
          STUDENTOS_SUPABASE_URL_1: ${{ secrets.STUDENTOS_SUPABASE_URL_1 }}
          STUDENTOS_SUPABASE_ANON_KEY_1: ${{ secrets.STUDENTOS_SUPABASE_ANON_KEY_1 }}
          STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_1: ${{ secrets.STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_1 }}
          STUDENTOS_SUPABASE_URL_2: ${{ secrets.STUDENTOS_SUPABASE_URL_2 }}
          STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_2: ${{ secrets.STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_2 }}
          STUDENTOS_SUPABASE_URL_3: ${{ secrets.STUDENTOS_SUPABASE_URL_3 }}
          STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_3: ${{ secrets.STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_3 }}
          STUDENTOS_SUPABASE_URL_4: ${{ secrets.STUDENTOS_SUPABASE_URL_4 }}
          STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_4: ${{ secrets.STUDENTOS_SUPABASE_SERVICE_ROLE_KEY_4 }}
          STUDENTOS_SUPABASE_JWT_SECRET: ${{ secrets.STUDENTOS_SUPABASE_JWT_SECRET }}
        run: node scripts/verifyAdaptiveRecoverySchemaLive.js

      - name: Enable recovery after topology and schema gates
        if: ${{ inputs.enable_adaptive_recovery }}
        uses: azure/cli@v2
        with:
          inlineScript: |
            for app_name in "${{ secrets.AZURE_CONTAINER_APP_NAME }}" "${{ secrets.AZURE_WORKER_CONTAINER_APP_NAME }}"; do
              az containerapp update \
                --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
                --name "$app_name" \
                --set-env-vars STUDENTOS_ADAPTIVE_RECOVERY_ENABLED=true STUDENTOS_BACKGROUND_WORKERS_ENABLED=true \
                --output none
            done

      - name: Show safe deployment summary
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp show \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
              --query "{name:name, fqdn:properties.configuration.ingress.fqdn, min:properties.template.scale.minReplicas, max:properties.template.scale.maxReplicas, latestRevision:properties.latestRevisionName}" \
              --output table
            az containerapp show \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --name "${{ secrets.AZURE_WORKER_CONTAINER_APP_NAME }}" \
              --query "{name:name, ingress:properties.configuration.ingress, min:properties.template.scale.minReplicas, max:properties.template.scale.maxReplicas, image:properties.template.containers[0].image, command:properties.template.containers[0].command, args:properties.template.containers[0].args, latestRevision:properties.latestRevisionName, readyRevision:properties.latestReadyRevisionName, runningStatus:properties.runningStatus}" \
              --output table
