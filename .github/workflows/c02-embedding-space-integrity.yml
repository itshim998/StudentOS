name: C-02 Embedding Space Integrity

on:
  push:
    branches:
      - fix/c02-embedding-space-integrity
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: c02-embedding-space-integrity
  cancel-in-progress: true

jobs:
  remediate-validate-commit:
    if: github.event_name == 'push' || github.head_ref == 'fix/c02-embedding-space-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/c02-embedding-space-integrity
          fetch-depth: 0

      - name: Skip after validated integration commit
        id: guard
        shell: bash
        run: |
          if [ ! -f scripts/applyC02Remediation.py ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node 22
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply C-02 integration patch
        if: steps.guard.outputs.skip != 'true'
        id: patch
        shell: bash
        run: |
          set +e
          python scripts/applyC02Remediation.py > /tmp/c02-patch.log 2>&1
          status=$?
          set -e
          cat /tmp/c02-patch.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish patch diagnostic
        if: failure() && steps.patch.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          diagnostic="$(tail -c 10000 /tmp/c02-patch.log)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
              -f body="### C-02 remediation patch diagnostic\n\n\`\`\`text\n${diagnostic}\n\`\`\`" || true
          fi

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.guard.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run C-02 focused retrieval tests
        if: steps.guard.outputs.skip != 'true'
        run: npm run test:embeddings && npm run test:pass9 && npm run test:rag && npm run test:pass7 && npm run test:sources && npm run test:persistence

      - name: Check repository syntax
        if: steps.guard.outputs.skip != 'true'
        run: npm run check:syntax

      - name: Run core smoke flow
        if: steps.guard.outputs.skip != 'true'
        run: npm run smoke:core

      - name: Run full regression suite
        if: steps.guard.outputs.skip != 'true'
        id: regression
        shell: bash
        run: |
          set +e
          npm test > /tmp/c02-regression.log 2>&1
          status=$?
          set -e
          cat /tmp/c02-regression.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish regression diagnostic
        if: failure() && steps.regression.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Error-focused lines:"
            grep -nE 'FAIL|Error:|AssertionError|failed|not ok|Expected|Received|Test timeout|playwright' /tmp/c02-regression.log | tail -n 100 || true
            echo
            echo "Final output:"
            tail -n 180 /tmp/c02-regression.log
          } > /tmp/c02-regression-diagnostic.log
          diagnostic="$(tail -c 12000 /tmp/c02-regression-diagnostic.log)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
              -f body="### C-02 regression diagnostic\n\n\`\`\`text\n${diagnostic}\n\`\`\`" || true
          fi

      - name: Run production and Azure preflights
        if: steps.guard.outputs.skip != 'true'
        run: npm run preflight:production && npm run preflight:azure

      - name: Validate migration and patch hygiene
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          grep -q "match_source_chunks_v2" supabase/migrations/202607270001_c02_embedding_space_integrity.sql
          grep -q "embedding_family" supabase/migrations/202607270001_c02_embedding_space_integrity.sql
          grep -q "embedding_version" supabase/migrations/202607270001_c02_embedding_space_integrity.sql
          grep -q "rpc-pgvector-rrf" supabase/migrations/202607270001_c02_embedding_space_integrity.sql
          grep -q "rpc-fts-rrf" supabase/migrations/202607270001_c02_embedding_space_integrity.sql
          ! grep -q 'match_source_chunks"' backend/repository/studentOsRepository.js
          git diff --check

      - name: Commit validated remediation and remove temporary files
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          rm .github/workflows/c02-embedding-space-integrity.yml
          rm -f .github/workflows/c02-pr-trigger.yml
          rm scripts/applyC02Remediation.py
          git config user.name "StudentOS Security Remediation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix C-02 embedding space integrity"
          git push origin HEAD:fix/c02-embedding-space-integrity
