name: C-02 PR Trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  trigger:
    if: github.head_ref == 'fix/c02-embedding-space-integrity'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger branch validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run c02-embedding-space-integrity.yml --ref fix/c02-embedding-space-integrity
