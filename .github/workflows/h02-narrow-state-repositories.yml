name: H-02 Narrow State Repositories

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: h02-narrow-state-repositories
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: github.head_ref == 'fix/h02-narrow-state-repositories'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/h02-narrow-state-repositories
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply H-02 remediation
        run: |
          python scripts/applyH02NarrowStateRepositories.py
          python scripts/fixupH02NarrowStateRepositories.py

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused H-02 tests
        run: npm run test:h02-state-repositories

      - name: Check syntax and core smoke flow
        run: npm run check:syntax && npm run smoke:core

      - name: Run complete regression suite
        id: regression
        run: npm test

      - name: Publish regression diagnostic
        if: failure() && steps.regression.outcome == 'failure'
        run: |
          echo "The full repository suite failed after the focused H-02 and smoke checks passed. Inspect the npm test output above for the first regression."

      - name: Run production and Azure preflights
        run: npm run preflight:production && npm run preflight:azure

      - name: Validate H-02 architecture and migration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'async loadDashboardState' backend/repository/studentOsRepository.js
          grep -q 'async loadAcademicContext' backend/repository/studentOsRepository.js
          grep -q 'async loadTestSession' backend/repository/studentOsRepository.js
          grep -q 'async loadAccountLifecycle' backend/repository/studentOsRepository.js
          grep -q 'async loadRecoveryState' backend/repository/studentOsRepository.js
          grep -q 'Promise.all(collectionPromises)' backend/repository/studentOsRepository.js
          grep -q 'persist_studentos_state_patch' backend/repository/studentOsRepository.js
          grep -q 'delete_studentos_source_artifacts' backend/repository/studentOsRepository.js
          grep -q 'load_studentos_state_scope' supabase/migrations/202607280001_h02_narrow_state_repositories.sql
          grep -q 'jsonb_populate_recordset' supabase/migrations/202607280001_h02_narrow_state_repositories.sql
          ! grep -q 'get diagnostics affected = affected + row_count' supabase/migrations/202607280001_h02_narrow_state_repositories.sql
          grep -q '202607280001_h02_narrow_state_repositories.sql' scripts/printMigrationPlan.js
          git diff --check

      - name: Commit validated remediation
        shell: bash
        run: |
          rm -f .github/workflows/h02-narrow-state-repositories.yml
          rm -f scripts/applyH02NarrowStateRepositories.py
          rm -f scripts/fixupH02NarrowStateRepositories.py
          rm -f docs/H02_*.tmp
          git config user.name "StudentOS Security Remediation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix H-02 narrow state repositories"
          git push origin HEAD:fix/h02-narrow-state-repositories
