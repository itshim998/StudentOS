name: C-01 PR Remediation Trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: c01-pr-remediation-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remediate:
    if: github.head_ref == 'fix/c01-assessment-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/c01-assessment-integrity
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and run staged C-01 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/c01-assessment-integrity-remediation.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install dependencies"
          start = source.find(start_marker)
          end = source.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('Could not extract staged remediation script')
          block = source[start + len(start_marker):end]
          lines = block.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/c01-remediation.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/c01-remediation.py

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused C-01 tests
        run: npm run test:c01-assessment-integrity && npm run test:domain && npm run test:phase2-2 && npm run test:phase2-3

      - name: Check repository syntax
        run: npm run check:syntax

      - name: Run full regression suite
        run: npm test

      - name: Run production and Azure preflights
        run: npm run preflight:production && npm run preflight:azure

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated remediation and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/c01-assessment-integrity-remediation.yml
          rm .github/workflows/c01-pr-remediation-trigger.yml
          git config user.name "StudentOS Security Remediation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/domain/studentosDomain.js backend/ai/studyTestService.js backend/server.js backend/testDomain.js backend/testC01AssessmentIntegrity.js package.json .github/workflows/c01-assessment-integrity-remediation.yml .github/workflows/c01-pr-remediation-trigger.yml
          git commit -m "Fix C-01 assessment score integrity"
          git push origin HEAD:fix/c01-assessment-integrity
