name: C-01 PR Remediation Trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: c01-pr-remediation-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remediate:
    if: github.head_ref == 'fix/c01-assessment-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/c01-assessment-integrity
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply C-01 integrity patch
        id: patch
        shell: bash
        run: |
          set +e
          python scripts/runC01Remediation.py > /tmp/c01-remediation.log 2>&1
          status=$?
          set -e
          cat /tmp/c01-remediation.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish patch diagnostic
        if: failure() && steps.patch.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          diagnostic="$(tail -c 12000 /tmp/c01-remediation.log)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="### C-01 remediation diagnostic\n\n\`\`\`text\n${diagnostic}\n\`\`\`"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused C-01 tests
        run: npm run test:c01-assessment-integrity && npm run test:domain && npm run test:phase2-2 && npm run test:phase2-3

      - name: Check repository syntax
        run: npm run check:syntax

      - name: Run full regression suite
        run: npm test

      - name: Run production and Azure preflights
        run: npm run preflight:production && npm run preflight:azure

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated remediation and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/c01-assessment-integrity-remediation.yml
          rm .github/workflows/c01-pr-remediation-trigger.yml
          rm scripts/runC01Remediation.py
          rm -f c01-remediation-error.log
          git config user.name "StudentOS Security Remediation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix C-01 assessment score integrity"
          git push origin HEAD:fix/c01-assessment-integrity
