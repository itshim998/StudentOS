name: H-03 Background Embedding Boundary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: h03-background-embedding-boundary
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: github.head_ref == 'fix/h03-background-embedding-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/h03-background-embedding-boundary
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply H-03 remediation
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/applyH03BackgroundEmbeddingBoundary.py")
          text = path.read_text(encoding="utf-8")
          old = '''server = replace_once(server, '    queueHealth: buildQueueHealth(state.backgroundJobs || []),\\n', '    queueHealth: buildQueueHealth(state.backgroundJobs || []),\\n    embeddingProcessing,\\n', "public processing summary")'''
          new = '''server = replace_once(
              server,
              '    queueHealth: buildQueueHealth(state.backgroundJobs || []),\\n    persistence: publicRetrievalStatus(persistence),',
              '    queueHealth: buildQueueHealth(state.backgroundJobs || []),\\n    embeddingProcessing,\\n    persistence: publicRetrievalStatus(persistence),',
              "public processing summary",
          )'''
          if text.count(old) != 1:
              raise SystemExit(f"H-03 anchor repair expected one match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python scripts/applyH03BackgroundEmbeddingBoundary.py 2>&1 | tee h03-patch.log
          python scripts/applyH03RecoveryScopePatch.py 2>&1 | tee -a h03-patch.log
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/smokeCoreFlows.js")
          text = path.read_text(encoding="utf-8")
          old_upload = '''    assert(["indexed", "ready"].includes(upload.material.status));
              assert(upload.chunkCount >= 1);'''.replace("              ", "    ")
          new_upload = '''    assert.equal(upload.material.status, "processing");
              assert.equal(upload.processing.status, "queued");
              assert.equal(upload.processing.readPathProcessing, false);
              assert.equal(upload.ingestionJob.status, "queued");
              assert.equal(upload.chunkCount, 0);'''.replace("              ", "    ")
          old_status = '''    const sourceStatus = await request(baseUrl, "/api/sources/status");
              assert(sourceStatus.sources.some((source) => source.id === upload.material.id));'''.replace("              ", "    ")
          new_status = '''    const sourceStatus = await request(baseUrl, "/api/sources/status");
              const uploadedSourceStatus = sourceStatus.sources.find((source) => source.id === upload.material.id);
              assert(uploadedSourceStatus);
              assert(["queued", "processing", "awaiting_worker"].includes(uploadedSourceStatus.processing.status));
              assert.equal(sourceStatus.embeddingProcessing.readPathProcessing, false);
              assert.equal(sourceStatus.embeddingProcessing.processingPerformed, false);'''.replace("              ", "    ")
          if text.count(old_upload) != 1 or text.count(old_status) != 1:
              raise SystemExit("H-03 smoke anchors did not match exactly")
          text = text.replace(old_upload, new_upload, 1).replace(old_status, new_status, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused H-03 tests
        shell: bash
        run: |
          set -o pipefail
          {
            npm run test:h03-background-embeddings
            npm run test:jobs
            npm run test:embeddings
            npm run test:h02-state-repositories
            npm run test:recovery
          } 2>&1 | tee h03-focused.log

      - name: Check syntax and core smoke flow
        shell: bash
        run: |
          set -o pipefail
          {
            npm run check:syntax
            npm run smoke:core
          } 2>&1 | tee h03-smoke.log

      - name: Run complete regression suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee h03-regression.log

      - name: Upload regression diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: h03-regression-diagnostic
          path: |
            h03-patch.log
            h03-focused.log
            h03-smoke.log
            h03-regression.log
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 2

      - name: Run production and Azure preflights
        run: npm run preflight:production && npm run preflight:azure

      - name: Validate H-03 architecture
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'ensureIndexedChunkEmbeddings' backend/server.js
          ! grep -q 'uploadStage = "chunk_embed"' backend/server.js
          ! grep -q 'await reindexSourceChunkEmbeddings' backend/server.js
          grep -q 'queueSourceIngestionJob' backend/server.js
          grep -q 'queueEmbeddingReindexJob' backend/server.js
          grep -q 'executionBoundary: "background_jobs_only"' backend/embeddings/embeddingProcessingStatus.js
          grep -q 'repository.saveBackgroundJobs' backend/jobs/workerRuntime.js
          grep -q 'async saveJobQueue' backend/repository/studentOsRepository.js
          grep -q "when 'recovery' then scope_keys := array\['courses','topics','exams'" supabase/migrations/202607280001_h02_narrow_state_repositories.sql
          git diff --check

      - name: Commit validated remediation
        shell: bash
        run: |
          rm -f .github/workflows/h03-background-embedding-boundary.yml
          rm -f scripts/applyH03BackgroundEmbeddingBoundary.py
          rm -f scripts/applyH03RecoveryScopePatch.py
          rm -f h03-patch.log h03-focused.log h03-smoke.log h03-regression.log
          git config user.name "StudentOS Security Remediation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix H-03 background embedding boundary"
          git push origin HEAD:fix/h03-background-embedding-boundary
