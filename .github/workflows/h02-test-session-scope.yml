name: H-02 Test Session Scope

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: h02-test-session-scope
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: github.head_ref == 'fix/h02-narrow-state-repositories'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/h02-narrow-state-repositories
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply test-session scope wiring
        run: python scripts/applyH02TestSessionScope.py

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused H-02 tests
        run: npm run test:h02-state-repositories

      - name: Check syntax and core smoke flow
        run: npm run check:syntax && npm run smoke:core

      - name: Run complete regression suite
        run: npm test

      - name: Run production and Azure preflights
        run: npm run preflight:production && npm run preflight:azure

      - name: Validate test-session routing
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'scope: "test_session", entityId: testSessionId' backend/server.js
          grep -q 'repository.loadTestSession' backend/server.js
          grep -q 'TEST_SESSION_COLLECTIONS' backend/repository/stateScopes.js
          git diff --check

      - name: Commit validated wiring
        shell: bash
        run: |
          rm -f .github/workflows/h02-test-session-scope.yml
          rm -f scripts/applyH02TestSessionScope.py
          git config user.name "StudentOS Security Remediation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire H-02 test-session scoped loading"
          git push origin HEAD:fix/h02-narrow-state-repositories
