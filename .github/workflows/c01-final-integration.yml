name: C-01 Final Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: c01-final-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: github.head_ref == 'fix/c01-assessment-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/c01-assessment-integrity
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final C-01 integration patch
        id: patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/finalizeC01Remediation.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('study = study_path.read_text(encoding="utf-8")nstudy_old =', 'study = study_path.read_text(encoding="utf-8")\nstudy_old =', 1)
          text = text.replace('replace_once(study, nstudy_old, nstudy_new,', 'replace_once(study, study_old, study_new,', 1)
          path.write_text(text, encoding="utf-8")
          PY
          set +e
          python scripts/finalizeC01Remediation.py > /tmp/c01-finalize.log 2>&1
          status=$?
          set -e
          cat /tmp/c01-finalize.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish integration diagnostic
        if: failure() && steps.patch.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          diagnostic="$(tail -c 12000 /tmp/c01-finalize.log)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="### C-01 final integration diagnostic\n\n\`\`\`text\n${diagnostic}\n\`\`\`"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run C-01 and related focused tests
        run: npm run test:c01-assessment-integrity && npm run test:domain && npm run test:phase2-2 && npm run test:phase2-3

      - name: Run core smoke flow
        run: npm run smoke:core

      - name: Check repository syntax
        run: npm run check:syntax

      - name: Run full regression suite
        run: npm test

      - name: Run production and Azure preflights
        run: npm run preflight:production && npm run preflight:azure

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated integration and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/c01-final-integration.yml
          rm scripts/finalizeC01Remediation.py
          git config user.name "StudentOS Security Remediation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete C-01 assessment integrity integration"
          git push origin HEAD:fix/c01-assessment-integrity
