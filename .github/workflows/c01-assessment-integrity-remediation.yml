name: C-01 Assessment Integrity Remediation

on:
  push:
    branches:
      - fix/c01-assessment-integrity

permissions:
  contents: write

concurrency:
  group: c01-assessment-integrity-remediation
  cancel-in-progress: false

jobs:
  remediate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/c01-assessment-integrity
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply C-01 integrity patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_between(text, start, end, replacement, label):
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"Missing start marker for {label}: {start}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"Missing end marker for {label}: {end}")
              return text[:start_index] + replacement + text[end_index:]

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match for {label}, found {count}")
              return text.replace(old, new, 1)

          domain_path = Path("backend/domain/studentosDomain.js")
          domain = domain_path.read_text(encoding="utf-8")

          score_block = r'''const LEGACY_SCORE_FORBIDDEN_TOP_LEVEL_FIELDS = new Set([
            "scorePercent",
            "score_percent",
            "answerKey",
            "answer_key",
            "creditsAwarded",
            "credits_awarded",
            "mastery",
            "masteryBand",
            "mastery_band",
            "isCorrect",
            "is_correct",
            "correct",
            "correctAnswer",
            "correct_answer",
            "expectedAnswer",
            "expected_answer",
            "rubric",
            "gradingRubric",
            "grading_rubric",
            "internalEvaluation",
            "internal_evaluation",
          ]);

          const LEGACY_SCORE_FORBIDDEN_ANSWER_FIELDS = new Set([
            "isCorrect",
            "is_correct",
            "correct",
            "correctAnswer",
            "correct_answer",
            "expectedAnswer",
            "expected_answer",
            "answerKey",
            "answer_key",
            "creditsAwarded",
            "credits_awarded",
            "mastery",
            "masteryBand",
            "mastery_band",
            "score",
            "scorePercent",
            "score_percent",
            "marks",
            "awardedMarks",
            "awarded_marks",
            "rubric",
            "gradingRubric",
            "grading_rubric",
            "internalEvaluation",
            "internal_evaluation",
          ]);

          function legacyScoreError(message, status = 400, code = "legacy_test_score_invalid") {
            const error = new Error(message);
            error.status = status;
            error.code = code;
            return error;
          }

          function hasOwn(record, key) {
            return Boolean(record && Object.prototype.hasOwnProperty.call(record, key));
          }

          function assertNoClientAssessmentAuthority(payload = {}) {
            if (!payload || typeof payload !== "object" || Array.isArray(payload)) {
              throw legacyScoreError("A test score request must be a JSON object.");
            }
            for (const field of LEGACY_SCORE_FORBIDDEN_TOP_LEVEL_FIELDS) {
              if (hasOwn(payload, field)) {
                throw legacyScoreError(`Client-controlled assessment field is not allowed: ${field}.`, 400, "legacy_test_score_authority_rejected");
              }
            }
            for (const answer of Array.isArray(payload.answers) ? payload.answers : []) {
              if (!answer || typeof answer !== "object" || Array.isArray(answer)) continue;
              for (const field of LEGACY_SCORE_FORBIDDEN_ANSWER_FIELDS) {
                if (hasOwn(answer, field)) {
                  throw legacyScoreError(`Client-controlled answer field is not allowed: ${field}.`, 400, "legacy_test_score_authority_rejected");
                }
              }
            }
          }

          function legacyQuestionId(question) {
            return String(question?.id ?? question?.questionId ?? question?.question_id ?? "").trim();
          }

          function comparableAnswer(value) {
            return String(value ?? "").trim();
          }

          function serverOwnedAnswerKey(session) {
            const questions = Array.isArray(session?.questions) ? session.questions : [];
            let answerKey = Array.isArray(session?.answerKey) ? session.answerKey : null;
            if (!answerKey && questions.length && questions.every((question) => hasOwn(question, "answer"))) {
              answerKey = questions.map((question) => question.answer);
            }
            if (!questions.length || !answerKey || answerKey.length !== questions.length) {
              throw legacyScoreError("This test does not have a complete server-owned answer key.", 409, "legacy_test_answer_key_unavailable");
            }
            return [...answerKey];
          }

          function normalizeLegacySubmittedAnswers(session, answers) {
            const questions = Array.isArray(session?.questions) ? session.questions : [];
            const questionIds = questions.map(legacyQuestionId);
            if (!questionIds.length || questionIds.some((questionId) => !questionId) || new Set(questionIds).size !== questionIds.length) {
              throw legacyScoreError("This test has invalid server-owned question identifiers.", 409, "legacy_test_question_set_invalid");
            }
            if (!Array.isArray(answers) || answers.length !== questionIds.length) {
              throw legacyScoreError("Submit exactly one answer for every test question.", 400, "legacy_test_answer_count_mismatch");
            }
            const allowedQuestionIds = new Set(questionIds);
            const answersByQuestionId = new Map();
            for (const answer of answers) {
              if (!answer || typeof answer !== "object" || Array.isArray(answer)) {
                throw legacyScoreError("Every submitted answer must include its question id.", 400, "legacy_test_answer_shape_invalid");
              }
              const questionId = String(answer.questionId ?? answer.question_id ?? "").trim();
              if (!questionId || !allowedQuestionIds.has(questionId)) {
                throw legacyScoreError("A submitted answer does not belong to this test.", 400, "legacy_test_question_id_mismatch");
              }
              if (answersByQuestionId.has(questionId)) {
                throw legacyScoreError("Each test question can be answered only once.", 400, "legacy_test_duplicate_question_id");
              }
              const selected = answer.selected ?? answer.answer ?? answer.value ?? "";
              answersByQuestionId.set(questionId, {
                questionId,
                selected: String(selected ?? ""),
              });
            }
            if (answersByQuestionId.size !== questionIds.length) {
              throw legacyScoreError("The submitted question ids do not exactly match this test.", 400, "legacy_test_question_id_mismatch");
            }
            return questionIds.map((questionId) => answersByQuestionId.get(questionId));
          }

          function legacyAnswerSignature(answers = []) {
            return JSON.stringify((answers || []).map((answer) => ({
              questionId: String(answer?.questionId || ""),
              selected: String(answer?.selected ?? ""),
            })));
          }

          function buildServerEvaluatedAnswers(session, orderedAnswers, answerKey, topic) {
            return session.questions.map((question, index) => ({
              question: question.prompt || question.question || `Question ${index + 1}`,
              questionId: legacyQuestionId(question),
              selected: orderedAnswers[index].selected,
              correct: answerKey[index],
              concept: question.concept || topic.title,
              isCorrect: comparableAnswer(orderedAnswers[index].selected) === comparableAnswer(answerKey[index]),
            }));
          }

          export function scoreMcqAnswers({ answers = [], answerKey = [] }) {
            if (!Array.isArray(answers) || !Array.isArray(answerKey) || answers.length === 0 || answers.length !== answerKey.length) return null;
            const correctCount = answers.filter((answer, index) => comparableAnswer(answerValue(answer)) === comparableAnswer(answerKey[index])).length;
            return Math.round((correctCount / answerKey.length) * 100);
          }

          '''
          domain = replace_between(
              domain,
              "export function scoreMcqAnswers",
              "export function isReasonableExtensionReason",
              score_block,
              "secure MCQ scoring",
          )

          public_legacy_session = r'''export function publicLegacyPracticeTestSession(session) {
            if (!session) return null;
            const projected = structuredClone(session);
            delete projected.answerKey;
            delete projected.answer_key;
            delete projected.scoreSettlement;
            delete projected.settledAnswerSignature;
            delete projected.internalEvaluation;
            projected.questions = (projected.questions || []).map((question) => {
              const {
                answer,
                answerKey,
                answer_key,
                correct,
                correctAnswer,
                correct_answer,
                expectedAnswer,
                expected_answer,
                modelAnswer,
                model_answer,
                solution,
                solutions,
                rubric,
                gradingRubric,
                grading_rubric,
                hiddenSolution,
                hiddenSolutions,
                isCorrect,
                ...safeQuestion
              } = question || {};
              return safeQuestion;
            });
            return projected;
          }

          '''
          domain = replace_once(
              domain,
              "export function queueRoadmapItem(state, item) {",
              public_legacy_session + "export function queueRoadmapItem(state, item) {",
              "legacy public test projection",
          )
          domain = replace_once(
              domain,
              "    testSession,\n    roadmapItem,",
              "    testSession: publicLegacyPracticeTestSession(testSession),\n    roadmapItem,",
              "assignment flow public test session",
          )
          domain = replace_once(
              domain,
              "  if (flow.testSession) {\n    flow.testSession.questions = Array.isArray(flow.testSession.questions) ? flow.testSession.questions : [];\n    flow.testSession.answerKey = Array.isArray(flow.testSession.answerKey) ? flow.testSession.answerKey : [];\n  }",
              "  if (flow.testSession) {\n    flow.testSession.questions = Array.isArray(flow.testSession.questions) ? flow.testSession.questions : [];\n  }",
              "assignment flow answer-key removal",
          )

          create_result_block = r'''export function createTestResult({ studentId, courseId, topicId, testSessionId, type = "mcq", answers = [], answerKey = [] }) {
            if (type !== "mcq") {
              throw legacyScoreError("The legacy score endpoint supports server-owned MCQ sessions only.", 409, "legacy_test_type_unsupported");
            }
            const derivedScore = scoreMcqAnswers({ answers, answerKey });
            if (derivedScore === null) {
              throw legacyScoreError("The submitted answers could not be scored against the server-owned test.", 400, "legacy_test_score_unavailable");
            }
            const safeSessionId = String(testSessionId || "").replace(/[^A-Za-z0-9_-]/g, "_").slice(0, 180);
            const id = safeSessionId
              ? `test_${safeSessionId}`
              : `test_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
            return {
              id,
              studentId,
              courseId,
              topicId,
              testSessionId: testSessionId || null,
              type,
              scorePercent: derivedScore,
              masteryBand: masteryBand(derivedScore),
              creditsAwarded: scoreToCredits(derivedScore),
              answers: answers.map((answer) => ({
                questionId: String(answer.questionId || ""),
                selected: String(answer.selected ?? ""),
              })),
              completedAt: new Date().toISOString(),
            };
          }

          '''
          domain = replace_between(
              domain,
              "export function createTestResult",
              "export function createCreditLedgerEntry",
              create_result_block,
              "server-derived test result",
          )

          apply_score_block = r'''function legacyScoreResponse(state, { session, result, topic, orderedAnswers, answerKey, replayed }) {
            const evaluatedAnswers = buildServerEvaluatedAnswers(session, orderedAnswers, answerKey, topic);
            const correctionSheet = createCorrectionSheet({
              topic,
              answers: evaluatedAnswers,
              scorePercent: result.scorePercent,
            });
            const creditEntry = state.creditLedger.find((entry) => entry.sourceId === result.id) || null;
            const roadmapItem = state.roadmap.find((item) => item.sourceTestResultId === result.id || item.id === `road_followup_${result.id}` || item.id === `road_repair_${result.id}`) || null;
            const revisionEvent = state.revisionEvents.find((item) => item.sourceTestResultId === result.id || item.id === `rev_${result.id}`) || null;
            const lesson = state.tutorLessons.find((item) => item.sourceTestResultId === result.id || item.id === `lesson_${result.id}`) || null;
            const scoreSummary = result.scorePercent >= 90
              ? "Mastery is secure. Credits unlocked for convenience workflows."
              : result.scorePercent >= 70
                ? "Good enough to earn credits, but corrections should be reviewed today."
                : "No credits yet. Review the corrections, then complete a StudentOS test to update topic readiness.";
            const nextRecommendedAction = result.scorePercent < 70
              ? "Open the tutor lesson, review the corrections, then complete a StudentOS test."
              : "Review the correction sheet, then do one 24-hour revision check.";
            return {
              id: result.id,
              testResult: result,
              result,
              replayed,
              scoreSummary,
              creditEntry,
              correctionSheet,
              weakTopics: [],
              roadmapItem,
              revisionEvent,
              tutorLesson: lesson,
              nextRecommendedAction,
              creditBalance: getCreditBalance(state),
            };
          }

          export function applyTestScore(state, payload = {}) {
            normalizeLearningState(state);
            assertNoClientAssessmentAuthority(payload);
            const testSessionId = String(payload.testSessionId || "").trim();
            if (!testSessionId) {
              throw legacyScoreError("An existing StudentOS test session is required.", 400, "legacy_test_session_required");
            }
            const session = state.testSessions.find((testSession) => testSession.id === testSessionId);
            if (!session) {
              throw legacyScoreError("This StudentOS test session was not found.", 404, "legacy_test_session_not_found");
            }
            const ownerId = session.userId || session.studentId || session.user_id || session.student_id || null;
            if (ownerId && state.studentProfile?.id && ownerId !== state.studentProfile.id) {
              throw legacyScoreError("This test session does not belong to the current account.", 403, "legacy_test_session_forbidden");
            }
            if ((session.questionFormat || session.type || "mcq") !== "mcq") {
              throw legacyScoreError("This test must use its dedicated evaluation flow.", 409, "legacy_test_type_unsupported");
            }
            const answerKey = serverOwnedAnswerKey(session);
            const orderedAnswers = normalizeLegacySubmittedAnswers(session, payload.answers);
            const signature = legacyAnswerSignature(orderedAnswers);
            const deterministicResultId = `test_${String(session.id).replace(/[^A-Za-z0-9_-]/g, "_").slice(0, 180)}`;
            const existingResult = state.testResults.find((result) => result.testSessionId === session.id || result.id === deterministicResultId) || null;
            if (existingResult) {
              const settledSignature = session.settledAnswerSignature || legacyAnswerSignature(existingResult.answers || []);
              if (settledSignature !== signature) {
                throw legacyScoreError("This test has already been scored and its answers cannot be changed.", 409, "legacy_test_already_settled");
              }
              return legacyScoreResponse(state, {
                session,
                result: existingResult,
                topic: topicById(state, existingResult.topicId || session.topicId),
                orderedAnswers,
                answerKey,
                replayed: true,
              });
            }
            if (session.status !== "open") {
              throw legacyScoreError("This test session is not open for scoring.", 409, "legacy_test_session_not_open");
            }
            const topic = topicById(state, session.topicId);
            const course = topic ? courseById(state, session.courseId || topic.courseId) : null;
            if (!topic || !course) {
              throw legacyScoreError("This test is missing its server-owned academic mapping.", 409, "legacy_test_mapping_unavailable");
            }
            const result = createTestResult({
              studentId: state.studentProfile.id,
              courseId: course.id,
              topicId: topic.id,
              testSessionId: session.id,
              type: "mcq",
              answers: orderedAnswers,
              answerKey,
            });
            const evaluatedAnswers = buildServerEvaluatedAnswers(session, orderedAnswers, answerKey, topic);
            const creditEntry = createCreditLedgerEntry(result);
            const correctionSheet = createCorrectionSheet({
              topic,
              answers: evaluatedAnswers,
              scorePercent: result.scorePercent,
            });
            const roadmapItem = createRevisionRoadmapItem({
              testResult: result,
              topicTitle: topic.title,
              assessmentEvidenceAvailable: true,
            });
            roadmapItem.sourceTestResultId = result.id;
            const revisionEvent = createRevisionEventForTopic({
              courseId: result.courseId,
              topicId: result.topicId,
              reason: result.scorePercent < 70
                ? "Immediate revision queued after score below 70%."
                : "Spaced revision within 24 hours after test corrections.",
            });
            revisionEvent.id = `rev_${result.id}`;
            revisionEvent.sourceTestResultId = result.id;
            const lesson = createTutorLesson({
              course,
              topic,
              sources: sourcesForTopic(state, topic),
              trigger: "test_result",
              coverageStatus: result.scorePercent < 70 ? "partially_covered" : "covered",
              wrongConcepts: correctionSheet.weakTopics,
            });
            lesson.id = `lesson_${result.id}`;
            lesson.sourceTestResultId = result.id;

            if (!state.testResults.some((item) => item.id === result.id)) state.testResults.push(result);
            if (creditEntry && !state.creditLedger.some((item) => item.id === creditEntry.id)) state.creditLedger.push(creditEntry);
            if (!state.roadmap.some((item) => item.id === roadmapItem.id)) state.roadmap.push(roadmapItem);
            if (!state.revisionEvents.some((item) => item.id === revisionEvent.id)) state.revisionEvents.push(revisionEvent);
            if (!state.tutorLessons.some((item) => item.id === lesson.id)) state.tutorLessons.push(lesson);

            const completedAt = result.completedAt;
            session.status = "completed";
            session.completedAt = completedAt;
            session.updatedAt = completedAt;
            session.resultId = result.id;
            session.settlementVersion = 2;
            session.settledAnswerSignature = signature;

            return legacyScoreResponse(state, {
              session,
              result,
              topic,
              orderedAnswers,
              answerKey,
              replayed: false,
            });
          }

          '''
          domain = replace_between(
              domain,
              "export function applyTestScore",
              "export function createAssignmentAutomationContract",
              apply_score_block,
              "secure legacy score settlement",
          )
          domain_path.write_text(domain, encoding="utf-8")

          study_path = Path("backend/ai/studyTestService.js")
          study = study_path.read_text(encoding="utf-8")
          public_study_block = r'''const PRIVATE_TEST_SESSION_FIELDS = [
            "answerKey",
            "answer_key",
            "scoreSettlement",
            "settledAnswerSignature",
            "gradingRubric",
            "grading_rubric",
            "hiddenSolutions",
            "hidden_solutions",
            "internalEvaluation",
            "internal_evaluation",
            "evaluationPrompt",
            "evaluation_prompt",
            "providerPayload",
            "provider_payload",
          ];

          function deletePrivateTestFields(record) {
            if (!record || typeof record !== "object") return record;
            for (const field of PRIVATE_TEST_SESSION_FIELDS) delete record[field];
            return record;
          }

          function stripQuestionSecrets(question) {
            const {
              answer,
              answerKey,
              answer_key,
              correct,
              correctAnswer,
              correct_answer,
              expectedAnswer,
              expected_answer,
              modelAnswer,
              model_answer,
              solution,
              solutions,
              rubric,
              gradingRubric,
              grading_rubric,
              hiddenSolution,
              hiddenSolutions,
              isCorrect,
              ...safeQuestion
            } = question || {};
            return safeQuestion;
          }

          function stripQuestionContainerSecrets(container) {
            if (!container || typeof container !== "object") return container;
            deletePrivateTestFields(container);
            if (Array.isArray(container.questions)) container.questions = container.questions.map(stripQuestionSecrets);
            return container;
          }

          export function publicTestSession(session, options = {}) {
            const projected = structuredClone(session);
            deletePrivateTestFields(projected);
            if (projected.answerSheetDraft?.extractedText) delete projected.answerSheetDraft.extractedText;
            if (projected.answerSheetDraft) deletePrivateTestFields(projected.answerSheetDraft);
            stripQuestionContainerSecrets(projected);
            if (projected.testPaper) stripQuestionContainerSecrets(projected.testPaper);
            if (projected.paper) stripQuestionContainerSecrets(projected.paper);
            return synchronizeTestSession(projected, options);
          }

          '''
          study = replace_between(
              study,
              "export function publicTestSession",
              "export function startStudyTestSession",
              public_study_block,
              "public study test projection",
          )
          study_path.write_text(study, encoding="utf-8")

          server_path = Path("backend/server.js")
          server = server_path.read_text(encoding="utf-8")
          old_results = '''    testResults: (state.testResults || []).map((result) => {
              const { topicEvidence, ...safeResult } = result;
              return safeResult;
            }),'''
          new_results = '''    testResults: (state.testResults || []).map((result) => {
              const {
                topicEvidence,
                answerKey,
                answer_key,
                gradingRubric,
                grading_rubric,
                hiddenSolutions,
                hidden_solutions,
                internalEvaluation,
                internal_evaluation,
                providerPayload,
                provider_payload,
                answers,
                ...safeResult
              } = result;
              const safeAnswers = Array.isArray(answers)
                ? answers.map((answer) => {
                    if (!answer || typeof answer !== "object" || Array.isArray(answer)) return answer;
                    const {
                      correct,
                      correctAnswer,
                      correct_answer,
                      expectedAnswer,
                      expected_answer,
                      answerKey: nestedAnswerKey,
                      answer_key: nestedAnswerKeySnake,
                      isCorrect,
                      is_correct,
                      rubric,
                      gradingRubric: nestedGradingRubric,
                      grading_rubric: nestedGradingRubricSnake,
                      internalEvaluation: nestedInternalEvaluation,
                      internal_evaluation: nestedInternalEvaluationSnake,
                      ...safeAnswer
                    } = answer;
                    return safeAnswer;
                  })
                : [];
              return { ...safeResult, answers: safeAnswers };
            }),'''
          server = replace_once(server, old_results, new_results, "public legacy test result sanitisation")
          server = replace_once(
              server,
              "    assignmentAutomationContracts: (state.assignmentAutomationContracts || []).filter(isAcademicContextRecord),\n    memoryItems:",
              "    assignmentAutomationContracts: (state.assignmentAutomationContracts || []).filter(isAcademicContextRecord),\n    assignmentLearningFlows: (state.assignmentLearningFlows || []).map((flow) => ({\n      ...flow,\n      testSession: flow.testSession ? publicTestSession(flow.testSession) : null,\n    })),\n    memoryItems:",
              "public assignment learning flows",
          )
          server_path.write_text(server, encoding="utf-8")

          test_domain = r'''import assert from "node:assert/strict";
          import {
            applyTestScore,
            buildExtensionDecisionDraft,
            createAssignmentAutomationContractForState,
            createTutorLesson,
            determineAssignmentCoverage,
            determineTopicCoverage,
            getCreditBalance,
            getTodayNextActions,
            handleAssignmentLearningFlow,
            scoreMcqAnswers,
            scoreToCredits,
          } from "./domain/studentosDomain.js";
          import { createSeedState } from "../tests/fixtures/studentAcademicState.js";

          function submittedAnswersFor(session, selector = (answer) => answer) {
            return session.questions.map((question, index) => ({
              questionId: question.id,
              selected: selector(session.answerKey[index], index, question),
            }));
          }

          assert.equal(scoreToCredits(95), 3);
          assert.equal(scoreToCredits(84), 2);
          assert.equal(scoreToCredits(70), 1);
          assert.equal(scoreToCredits(69), 0);
          assert.equal(scoreMcqAnswers({ answers: ["A", "B", "C", "D"], answerKey: ["A", "B", "C", "X"] }), 75);
          assert.equal(scoreMcqAnswers({ answers: ["A"], answerKey: ["A", "B"] }), null);
          assert.equal(scoreMcqAnswers({ answers: [{ selected: "B", isCorrect: true }], answerKey: ["A"] }), 0);

          const answerKeyState = createSeedState(new Date("2026-05-25T10:00:00+05:30"));
          const answerKeyFlow = handleAssignmentLearningFlow(answerKeyState, "assign_quad_ws");
          const answerKeySession = answerKeyState.testSessions.find((session) => session.id === answerKeyFlow.testSession.id);
          const answerKeyResult = applyTestScore(answerKeyState, {
            testSessionId: answerKeySession.id,
            answers: submittedAnswersFor(answerKeySession, (answer, index) => index < 6 ? answer : "wrong"),
          });
          assert.equal(answerKeyResult.result.scorePercent, 75);
          assert.equal(answerKeyResult.result.creditsAwarded, 1);
          assert.equal(answerKeyResult.creditEntry.amount, 1);
          assert.equal(answerKeyResult.result.answerKey, undefined);

          const state = createSeedState(new Date("2026-05-25T10:00:00+05:30"));
          const coveredCoverage = determineAssignmentCoverage(state, "assign_quad_ws");
          assert.equal(coveredCoverage.status, "covered");
          const partialCoverage = determineAssignmentCoverage(state, "assign_stats_review");
          assert.equal(partialCoverage.status, "partially_covered");
          const uncoveredCoverage = determineAssignmentCoverage(state, "assign_trig_intro");
          assert.equal(uncoveredCoverage.status, "uncovered");

          const trigTopicCoverage = determineTopicCoverage(state, "topic_trig_basics");
          assert.equal(trigTopicCoverage.status, "uncovered");

          const failedState = createSeedState(new Date("2026-05-25T10:00:00+05:30"));
          const failedFlow = handleAssignmentLearningFlow(failedState, "assign_quad_ws");
          const failedSession = failedState.testSessions.find((session) => session.id === failedFlow.testSession.id);
          const failedBeforeCredits = getCreditBalance(failedState);
          const failed = applyTestScore(failedState, {
            testSessionId: failedSession.id,
            answers: submittedAnswersFor(failedSession, () => "definitely-wrong"),
          });
          assert.equal(failed.result.creditsAwarded, 0);
          assert.equal(failed.roadmapItem.priority, "urgent");
          assert.equal(failed.correctionSheet.corrections.length, failedSession.questions.length);
